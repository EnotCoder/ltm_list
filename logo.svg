<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="300"
     viewBox="0 0 850 300"
     role="img"
     aria-labelledby="title desc">

  <title id="title">ltm list — Python toolkit</title>
  <desc id="desc">
    Сине-жёлтый значок Python рядом с названием ltm list.
